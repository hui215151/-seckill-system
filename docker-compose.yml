version: "3.8"

# 可选：用 Docker 一键起依赖（本机已验证的方案是 Windows 便携版，见 README）
# 使用：docker compose up -d
# 然后应用用 application.yml 连接 127.0.0.1:3307 / 6379 / 5672
services:
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "seckill123"   # 本地演示用，请勿用于生产
      MYSQL_DATABASE: "seckill"
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ./sql/seckill.sql:/docker-entrypoint-initdb.d/seckill.sql:ro
      - seckill-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pseckill123"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    container_name: seckill-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: seckill-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  seckill-mysql-data:
